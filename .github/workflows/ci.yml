name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes

      - name: Static checks
        run: |
          python -m compileall -q app scripts tests
          # Undefined names / syntax problems only; unused-import noise is not gating.
          python -m pyflakes app | grep -E "undefined name|syntax error" && exit 1 || true
          bash -n start_services.sh start_cloudrun.sh deploy_to_gcp.sh

      - name: Tests
        env:
          ROSEGOLD_OUTPUT_DIR: ${{ runner.temp }}/rosegold-outputs
        run: python -m pytest -p no:logfire -q tests/

  container-hygiene:
    name: container hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No credentialed data or weights can reach an image
        run: |
          set -euo pipefail
          for pat in 'mimic-iii-ext-notes' '*.gguf' '*.zip' 'outputs' 'tests'; do
            grep -qF -- "$pat" .dockerignore || { echo "missing $pat in .dockerignore"; exit 1; }
          done
          ! grep -RIn --include=Dockerfile* 'COPY data/ ' . || { echo "Dockerfile copies all of data/"; exit 1; }

      - name: No hardcoded endpoints in source
        run: |
          set -euo pipefail
          # Any literal http(s)://<ip> in app/ is a review flag (loopback excepted).
          if grep -RInE 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}' app/ | grep -v '127\.0\.0\.1'; then
            echo "hardcoded IP endpoint in app/"; exit 1
          fi

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off
